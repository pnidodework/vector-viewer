<div class="toolbar">
  <!-- Selection / Pan tools -->
  <div class="tool-group">
    <button class="tool-btn" [class.active]="activeTool === 'select'"
            (click)="setTool('select')" title="Select">
      <svg viewBox="0 0 24 24"><path d="M7 2l10 10-4 1 3 7-2 1-3-7-4 3z"/></svg>
    </button>
    <button class="tool-btn" [class.active]="activeTool === 'pan'"
            (click)="setTool('pan')" title="Pan">
      <svg viewBox="0 0 24 24"><path d="M10 2v8H5l7 7 7-7h-5V2h-4zM3 20h18v2H3z"/></svg>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Annotation tools -->
  <div class="tool-group">
    <button class="tool-btn" [class.active]="activeTool === 'stickyNote'"
            (click)="setTool('stickyNote')" title="Sticky Note">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12h-6v4H4V4z"/><path d="M14 16h6l-6 4v-4z"/></svg>
    </button>
    <div class="stamp-wrapper">
      <button class="tool-btn" [class.active]="activeTool === 'stamp'"
              (click)="selectStampTool()" title="Rubber Stamp">
        <svg viewBox="0 0 24 24"><path d="M7 19h10v2H7zM12 3a3 3 0 0 0-3 3v3H7l2 5h6l2-5h-2V6a3 3 0 0 0-3-3z"/><rect x="5" y="16" width="14" height="2"/></svg>
      </button>
      <div class="stamp-dropdown" *ngIf="showStampSelector">
        <button *ngFor="let s of stampOptions" class="stamp-option"
                [class.selected]="selectedStamp === s"
                (click)="selectStamp(s)">{{ s }}</button>
      </div>
    </div>
  </div>

  <div class="separator"></div>

  <!-- Drawing tools -->
  <div class="tool-group">
    <button class="tool-btn" [class.active]="activeTool === 'arrow'"
            (click)="setTool('arrow')" title="Arrow">
      <svg viewBox="0 0 24 24"><path d="M4 12h14M14 6l6 6-6 6"/></svg>
    </button>
    <button class="tool-btn" [class.active]="activeTool === 'circle'"
            (click)="setTool('circle')" title="Circle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
    </button>
    <button class="tool-btn" [class.active]="activeTool === 'line'"
            (click)="setTool('line')" title="Line">
      <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/></svg>
    </button>
    <button class="tool-btn" [class.active]="activeTool === 'highlighter'"
            (click)="setTool('highlighter')" title="Highlighter">
      <svg viewBox="0 0 24 24"><path d="M16.5 3.5l4 4-9 9H7.5v-4l9-9zM4 20h16"/></svg>
    </button>
    <button class="tool-btn" [class.active]="activeTool === 'freehand'"
            (click)="setTool('freehand')" title="Freehand Draw">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Image operations -->
  <div class="tool-group">
    <button class="tool-btn" [class.active]="activeTool === 'crop'"
            (click)="setTool('crop')" title="Crop">
      <svg viewBox="0 0 24 24"><path d="M6 2v4H2v2h4v10h10v4h2v-4h4v-2H8V6h10v10h2V4H6z"/></svg>
    </button>
    <div class="rotate-group">
      <button class="tool-btn" (click)="rotate90()" title="Rotate 90&deg;">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      </button>
    </div>
    <button class="tool-btn" (click)="toggleImageAdjust()" title="Brightness/Contrast"
            [class.active]="showImageAdjust">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <!-- Image adjust panel -->
  <div class="image-adjust-panel" *ngIf="showImageAdjust">
    <div class="adjust-row">
      <label>Brightness</label>
      <input type="range" min="0" max="200" [value]="brightness"
             (input)="onBrightnessChange($any($event.target).valueAsNumber)" />
      <span>{{ brightness }}%</span>
    </div>
    <div class="adjust-row">
      <label>Contrast</label>
      <input type="range" min="0" max="200" [value]="contrast"
             (input)="onContrastChange($any($event.target).valueAsNumber)" />
      <span>{{ contrast }}%</span>
    </div>
  </div>

  <div class="separator"></div>

  <!-- Zoom controls -->
  <div class="tool-group">
    <button class="tool-btn" (click)="zoomIn()" title="Zoom In">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
    </button>
    <button class="tool-btn" (click)="zoomOut()" title="Zoom Out">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn" (click)="fitToScreen()" title="Fit to Screen">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zM15 3h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zM19 19h-4v2h6v-6h-2v4z"/></svg>
    </button>
    <button class="tool-btn" (click)="actualSize()" title="Actual Size">
      <span class="icon-text">1:1</span>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Undo / Redo / Save -->
  <div class="tool-group">
    <button class="tool-btn" (click)="undo()" [disabled]="!canUndo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M12.5 8C9.85 8 7.45 8.99 5.6 10.6L2 7v9h9l-3.62-3.62A8 8 0 0 1 20 16l2.4-1.2A10.5 10.5 0 0 0 12.5 8z"/></svg>
    </button>
    <button class="tool-btn" (click)="redo()" [disabled]="!canRedo" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62A8 8 0 0 0 4 16l-2.4-1.2A10.5 10.5 0 0 1 11.5 8z"/></svg>
    </button>
    <button class="tool-btn save-btn" (click)="save()" title="Save Annotations">
      <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4z"/><path d="M7 3v5h8V3"/><path d="M7 14h10v7H7z"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <!-- Cross-Ref & Export -->
  <div class="tool-group">
    <button class="tool-btn" (click)="openCrossRefDialog.emit()" title="Cross References">
      <svg viewBox="0 0 24 24"><path d="M3.9 12A5.1 5.1 0 0 1 9 6.9h2V5H9a7 7 0 0 0 0 14h2v-1.9H9A5.1 5.1 0 0 1 3.9 12zM15 5h-2v1.9h2a5.1 5.1 0 0 1 0 10.2h-2V19h2a7 7 0 0 0 0-14zM8 11h8v2H8z"/></svg>
    </button>
    <button class="tool-btn export-btn" (click)="onExport()" title="Export">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Export
    </button>
  </div>
</div>
